name: Build macOS AU Component

on: [push, workflow_dispatch]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install cmake pkg-config libsndfile jack lv2 faust

      - name: Compile AU Component Bundle
        run: |
          # 1. Create the Audio Unit bundle folder structure
          mkdir -p build-au/foo-yc20.component/Contents/MacOS

          # 2. Compile pre-generated C++ code into universal binary
          clang++ -arch arm64 -arch x86_64 -std=c++11 -shared \
            -framework AudioUnit -framework CoreAudio -framework CoreFoundation -framework AudioToolbox \
            -I. -Igen -I$(brew --prefix faust)/share/faust \
            gen/yc20-dsp-plugin.cpp -o build-au/foo-yc20.component/Contents/MacOS/foo-yc20 || \
          clang++ -arch arm64 -arch x86_64 -std=c++11 -shared \
            -framework AudioUnit -framework CoreAudio -framework CoreFoundation -framework AudioToolbox \
            -I. -Igen -I$(brew --prefix faust)/share/faust \
            src/*.cpp -o build-au/foo-yc20.component/Contents/MacOS/foo-yc20

          # 3. Create Audio Unit Info.plist required by Logic / GarageBand
          cat << 'EOF' > build-au/foo-yc20.component/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>foo-yc20</string>
              <key>CFBundleIdentifier</key>
              <string>com.mamedev.fooyc20</string>
              <key>CFBundleName</key>
              <string>foo-yc20</string>
              <key>CFBundlePackageType</key>
              <string>BNDL</string>
              <key>CFBundleSignature</key>
              <string>????</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
          </dict>
          </plist>
          EOF

      - name: Upload AU Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: foo-yc20-AU-GarageBand-Logic
          path: build-au/foo-yc20.component
