name: Build macOS AU Component

on: [push, workflow_dispatch]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install cmake pkg-config libsndfile jack lv2 faust

      - name: Build AU Bundle
        run: |
          # 1. Generate single C++ file from Faust source files
          faust -I faust-src -a au-effect.cpp faust-src/yc20.dsp -o faust-gen.cpp || \
          faust -a au-effect.cpp faust-src/foo-yc20.dsp -o faust-gen.cpp || \
          faust -a au-effect.cpp dsp/yc20.dsp -o faust-gen.cpp

          # 2. Create Audio Unit Bundle structure
          mkdir -p build-au/foo-yc20.component/Contents/MacOS

          # 3. Compile universal binary (Intel + Apple Silicon)
          clang++ -arch arm64 -arch x86_64 -std=c++11 -shared \
            -framework AudioUnit -framework CoreAudio -framework CoreFoundation -framework AudioToolbox \
            -I$(brew --prefix faust)/share/faust \
            faust-gen.cpp -o build-au/foo-yc20.component/Contents/MacOS/foo-yc20

          # 4. Generate Info.plist required by macOS AU scanner
          cat << 'EOF' > build-au/foo-yc20.component/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>foo-yc20</string>
              <key>CFBundleIdentifier</key>
              <string>com.mamedev.fooyc20</string>
              <key>CFBundleName</key>
              <string>foo-yc20</string>
              <key>CFBundlePackageType</key>
              <string>BNDL</string>
              <key>CFBundleSignature</key>
              <string>????</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
          </dict>
          </plist>
          EOF

      - name: Upload AU Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: foo-yc20-AU-GarageBand-Logic
          path: build-au/foo-yc20.component
