name: Build Native macOS Audio Unit (AU)

on: [push, workflow_dispatch]

jobs:
  build-au:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Faust Compiler
        run: |
          brew install faust

      - name: Transpile Faust DSP to Audio Unit C++
        run: |
          mkdir -p build-au/foo-yc20.component/Contents/MacOS
          mkdir -p build-au/foo-yc20.component/Contents/Resources

          # Transpile the correct main DSP entry point using the Audio Unit Instrument architecture
          faust -a au-instrument.cpp -I faust faust/foo-yc20.dsp -o build-au/au-wrapper.cpp

      - name: Compile Universal Audio Unit Binary
        run: |
          cd build-au
          FAUST_SHARE=$(brew --prefix faust)/share/faust

          # Compile universal arm64 (Apple Silicon) + x86_64 (Intel) bundle
          clang++ -arch arm64 -arch x86_64 -std=c++11 -shared \
            -framework AudioUnit \
            -framework CoreAudio \
            -framework AudioToolbox \
            -framework CoreFoundation \
            -I "$FAUST_SHARE" \
            au-wrapper.cpp \
            -o foo-yc20.component/Contents/MacOS/foo-yc20

      - name: Generate Audio Unit Info.plist
        run: |
          cat << 'EOF' > build-au/foo-yc20.component/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>foo-yc20</string>
              <key>CFBundleIdentifier</key>
              <string>com.faust.fooyc20</string>
              <key>CFBundleName</key>
              <string>foo-yc20</string>
              <key>CFBundlePackageType</key>
              <string>BNDL</string>
              <key>CFBundleSignature</key>
              <string>????</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CSResourcesFileMapped</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Upload Audio Unit Artifact
        uses: actions/upload-artifact@v5
        with:
          name: foo-yc20-Native-AU
          path: build-au/foo-yc20.component
