name: Build Native macOS Audio Unit (AU)

on: [push, workflow_dispatch]

jobs:
  build-au:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Build Dependencies
        run: |
          brew install cmake faust

      - name: Install JUCE Framework
        run: |
          git clone --depth 1 https://github.com/juce-framework/JUCE.git ~/JUCE

      - name: Generate C++ Audio Unit Source via faust2juce
        run: |
          # Generate the JUCE source code using faust2juce
          faust2juce -jucemodulesdir ~/JUCE/modules yc20.dsp

          # Enter the generated project directory
          cd yc20/Builds/MacOSX

          # Configure Xcode build settings for Audio Unit
          xcodebuild -project yc20.xcodeproj -scheme "yc20 - AU" -configuration Release build

      - name: Package Audio Unit Bundle
        run: |
          mkdir -p build-au/
          cp -r yc20/Builds/MacOSX/build/Release/yc20.component build-au/

      - name: Upload Native AU Artifact
        uses: actions/upload-artifact@v5
        with:
          name: foo-yc20-Native-AU
          path: build-au/yc20.component
