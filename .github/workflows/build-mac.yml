name: Build macOS AU Component

on: [push, workflow_dispatch]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install faust pkg-config

      - name: Compile Faust DSP to macOS Audio Unit
        run: |
          # Create Audio Unit bundle directories
          mkdir -p build-au/foo-yc20.component/Contents/MacOS

          # Generate single C++ Audio Unit source from Faust code using the native AU architecture
          faust -a au-effect.cpp faust/yc20.dsp -o foo-yc20-au.cpp || \
          faust -a au-effect.cpp faust/foo-yc20.dsp -o foo-yc20-au.cpp || \
          faust -a au-effect.cpp yc20.dsp -o foo-yc20-au.cpp

          # Compile C++ code into universal macOS binary (Intel + Apple Silicon)
          clang++ -arch arm64 -arch x86_64 -std=c++11 -shared \
            -framework AudioUnit -framework CoreAudio -framework CoreFoundation -framework AudioToolbox \
            -I$(brew --prefix faust)/share/faust \
            foo-yc20-au.cpp -o build-au/foo-yc20.component/Contents/MacOS/foo-yc20

          # Generate Info.plist required by macOS Audio Unit validation
          cat << 'EOF' > build-au/foo-yc20.component/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>foo-yc20</string>
              <key>CFBundleIdentifier</key>
              <string>com.mamedev.fooyc20</string>
              <key>CFBundleName</key>
              <string>foo-yc20</string>
              <key>CFBundlePackageType</key>
              <string>BNDL</string>
              <key>CFBundleSignature</key>
              <string>????</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
          </dict>
          </plist>
          EOF

      - name: Upload AU Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: foo-yc20-AU-GarageBand-Logic
          path: build-au/foo-yc20.component
