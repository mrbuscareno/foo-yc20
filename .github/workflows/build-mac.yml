name: Build macOS AU Component

on: [push, workflow_dispatch]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install cmake pkg-config libsndfile jack lv2 faust

      - name: Build Faust AU Target
        run: |
          # Set Faust library path for Homebrew on Apple Silicon / macOS runners
          export FAUSTLIB=$(brew --prefix faust)/share/faust
          
          # Symlink Faust headers where faust2au expects them
          sudo mkdir -p /usr/local/include /usr/local/share
          sudo ln -s $(brew --prefix faust)/include/faust /usr/local/include/faust
          sudo ln -s $(brew --prefix faust)/share/faust /usr/local/share/faust

          # Navigate into the faust directory where foo-yc20.dsp lives
          cd faust
          
          # Generate Audio Unit plugin (.component)
          faust2au foo-yc20.dsp
          
          cd ..
          mkdir -p build-au
          mv faust/foo-yc20.component build-au/

      - name: Upload AU Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: foo-yc20-AU-GarageBand-Logic
          path: build-au/foo-yc20.component
